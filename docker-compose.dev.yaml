# Dev bench override: run `play` from the working tree with hot reload instead
# of the production image. NEVER use this file on the VPS.
#
#   ./dev.sh up        (wraps: docker compose --env-file .env.dev -p bleu-dev
#                        -f docker-compose.yaml -f docker-compose.dev.yaml ...)
#
# vite serves the front end on container port 8080 (front.<BASE_DOMAIN>), the
# pusher runs on 3000/3001. Edit a .svelte or .ts file under play/src and the
# browser reloads in seconds.
services:
  play:
    build: !reset null
    image: thecodingmachine/nodejs:v2-20-bullseye
    working_dir: /usr/src/app/play
    command: npm run dev
    restart: "no"
    tmpfs:
      - /tmp
    volumes:
      - .:/usr/src/app
    environment:
      STARTUP_COMMAND_1: ../wait-proto.sh
      STARTUP_COMMAND_2: ../npm-install.sh
      STARTUP_COMMAND_3: npm run typesafe-i18n
      NODE_ENV: development
      DEBUG_ERROR_MESSAGES: "true"
      VITE_URL: "${WEB_SCHEME:-http}://front.${BASE_DOMAIN:-workadventure.localhost}${WEB_PORT:-}"
    labels:
      traefik.http.services.front.loadbalancer.server.port: "8080"

  # These three run `npm install` on the SAME bind-mounted tree as play. With
  # NODE_ENV=production that install drops devDependencies, which deletes vite
  # out from under the running front end (found 2026-11-16). Keep dev deps.
  back:
    environment:
      NPM_CONFIG_INCLUDE: dev
  map-storage:
    environment:
      NPM_CONFIG_INCLUDE: dev
  uploader:
    environment:
      NPM_CONFIG_INCLUDE: dev
