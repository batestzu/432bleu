  # TURN relay for the proximity WebRTC mesh. Without it, phones on carrier-grade NAT
  # never establish a peer connection: every relay candidate fails, RemotePeer's 5s
  # CONNECTION_TIMEOUT fires and the tile shows "Reconnecting... Unstable connection...".
  #
  # network_mode: host is required, not a shortcut -- TURN hands out the relay ports in
  # its candidates, so they must be the host's real ports, and publishing the whole
  # min-port..max-port range through the bridge would be both slow and pointless.
  #
  # Runs as root to read Caddy's certificate directory, which is mode 0700 caddy:caddy.
  # The livekit service reads the same directory the same way.
  coturn:
    restart: unless-stopped
    image: coturn/coturn:4.6.2
    network_mode: host
    user: "0:0"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - /var/lib/caddy/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.432bleu.com:/etc/caddy-certs:ro
    command:
      - turnserver
      - -c=/etc/coturn/turnserver.conf
      # Kept out of the tracked config file; must match what play uses to mint credentials.
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boxoffice
      POSTGRES_PASSWORD: boxoffice
      POSTGRES_DB: boxoffice
    volumes:
      - postgres-data:/var/lib/postgresql/data

  boxoffice:
    restart: unless-stopped
    build: ./boxoffice
    environment:
      DATABASE_URL: postgresql://boxoffice:boxoffice@postgres:5432/boxoffice
      PLAY_URL: ${WEB_SCHEME:-https}://play.${BASE_DOMAIN:-432bleu.com}${WEB_PORT:-}
      BOXOFFICE_DOMAIN: ${WEB_SCHEME:-https}://boxoffice.${BASE_DOMAIN:-432bleu.com}${WEB_PORT:-}
      STRIPE_SECRET_KEY: "$STRIPE_SECRET_KEY"
      STRIPE_WEBHOOK_SECRET: "$STRIPE_WEBHOOK_SECRET"
      SENDGRID_API_KEY: "$SENDGRID_API_KEY"
      FROM_EMAIL: boxoffice@432bleu.com
      STAFF_TOKEN: "$STAFF_TOKEN"
      SESSION_SECRET_KEY: "$SESSION_SECRET_KEY"
      NOWPAYMENTS_API_KEY: "$NOWPAYMENTS_API_KEY"
      NOWPAYMENTS_IPN_SECRET: "$NOWPAYMENTS_IPN_SECRET"
      # OIDC provider for WA staff login (routes/oidc.py, scripts/vps/OIDC-PLAN.md).
      # Issuer derives from BOXOFFICE_DOMAIN above. Disabled (503) until the secret
      # and key are set in .env via scripts/vps/setup-secrets.sh.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-wa-play}
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_PRIVATE_KEY_B64: "${OIDC_PRIVATE_KEY_B64:-}"
      OIDC_STAFF_TAGS: "${OIDC_STAFF_TAGS:-}"
      OIDC_REDIRECT_URIS: ${OIDC_REDIRECT_URIS:-https://play.432bleu.com/openid-callback}

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.boxoffice.rule=Host(`boxoffice.${BASE_DOMAIN:-432bleu.com}`)"
      - "traefik.http.routers.boxoffice.entryPoints=web"
      - "traefik.http.routers.boxoffice.priority=100"
      - "traefik.http.services.boxoffice.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_started

  # Self-hosted, cookieless analytics for the box office. Nothing is sent to a
  # third party: this container and its data live on our own box.
  #
  # Pinned to an explicit version on purpose. Umami's releases run ahead of its
  # published images -- GHCR carries versioned tags only through v2.20.2, and the
  # v3 line exists solely as the moving `postgresql-latest` tag. A moving tag here
  # would let a major upgrade land by itself during show week.
  umami:
    restart: unless-stopped
    image: ghcr.io/umami-software/umami:postgresql-v2.20.2
    environment:
      # Its own database inside the Postgres we already run. Create it once with:
      #   docker compose exec -T postgres createdb -U boxoffice -O boxoffice umami
      DATABASE_URL: postgresql://boxoffice:boxoffice@postgres:5432/umami
      APP_SECRET: "$UMAMI_APP_SECRET"
      DISABLE_TELEMETRY: "1"
      # Caddy -> Traefik both forward this, so visitor counts reflect real clients
      # instead of resolving to the proxy's own address.
      CLIENT_IP_HEADER: X-Forwarded-For
    ports:
      # Dashboard is deliberately NOT routed through Traefik: the prebuilt image
      # has no BASE_PATH baked in (it is a build-time variable), so its Next.js
      # assets only resolve at a domain root. Binding to loopback means the admin
      # login is never exposed to the internet at all. Reach it with:
      #   ssh -L 3001:127.0.0.1:3001 vspot@<vps>   then open http://localhost:3001
      - "127.0.0.1:3001:3000"
    labels:
      # Public surface is exactly two routes -- the tracker script and the
      # collection endpoint. Path() is exact on purpose: a PathPrefix(`/_a`) would
      # also expose /_a/api/auth/login and hand the internet a login form to
      # brute-force through a path that looks like analytics.
      - "traefik.enable=true"
      - "traefik.http.routers.umami-tracker.rule=Host(`boxoffice.${BASE_DOMAIN:-432bleu.com}`) && (Path(`/_a/script.js`) || Path(`/_a/api/send`))"
      - "traefik.http.routers.umami-tracker.entryPoints=web"
      # Above boxoffice's 100 so these two paths win over its catch-all Host rule.
      - "traefik.http.routers.umami-tracker.priority=200"
      - "traefik.http.routers.umami-tracker.middlewares=umami-strip"
      - "traefik.http.routers.umami-tracker.service=umami"
      - "traefik.http.middlewares.umami-strip.stripprefix.prefixes=/_a"
      - "traefik.http.services.umami.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_started

  # Never Silent: audio bed for the lobby/bar playAudio zones. Sources are the
  # on_publish.sh / start_loop.sh audio legs (host-side, scripts/vps/). Bound to
  # loopback only; Caddy terminates TLS for icecast.432bleu.com in front of it.
  # Set the ICECAST_* passwords in .env BEFORE first `up -d icecast`.
  icecast:
    restart: unless-stopped
    image: libretime/icecast:2.4.4
    ports:
      - "127.0.0.1:8005:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-}"
      ICECAST_RELAY_PASSWORD: "${ICECAST_RELAY_PASSWORD:-}"
      ICECAST_HOSTNAME: "icecast.${BASE_DOMAIN:-432bleu.com}"

volumes:
  postgres-data:
    external: true
    name: workadventure_postgres-data
