<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Return to Concert</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h2 { font-size: 1.2rem; margin-bottom: 8px; color: #c084fc; }
        p { color: #9ca3af; margin-bottom: 24px; font-size: 0.9rem; }
        button {
            padding: 12px 28px;
            background: #7c3aed;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <h2>🎶 Return to Concert</h2>
    <p>Head back to the audience area?</p>
    <button onclick="goBack()">Return to Concert Hall</button>

    <script src="https://play.432bleu.com/iframe_api.js"></script>
    <script>
        function goBack() {
            WA.player.teleport(608, 768);
            WA.ui.closePopup && WA.ui.closePopup();
        }
    </script>
</body>
</html>
