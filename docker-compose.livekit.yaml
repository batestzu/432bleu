services:
  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit/config.yaml
    ports:
      - "7880:7880" # HTTP API / WS signaling (proxied via Caddy as livekit.432bleu.com)
      - "7882:7882/udp" # WebRTC media (RTC UDP) — published directly, bypasses Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.livekit.rule=Host(`livekit.432bleu.com`)"
      - "traefik.http.routers.livekit.entryPoints=web"
      - "traefik.http.services.livekit.loadbalancer.server.port=7880"
    volumes:
      - ./livekit-config.yaml:/etc/livekit/config.yaml
    depends_on:
      redis:
        condition: service_started

  back:
    environment:
      LIVEKIT_HOST: "$LIVEKIT_HOST"
      LIVEKIT_API_KEY: "$LIVEKIT_API_KEY"
      LIVEKIT_API_SECRET: "$LIVEKIT_API_SECRET"
      MAX_USERS_FOR_WEBRTC: "$MAX_USERS_FOR_WEBRTC"
