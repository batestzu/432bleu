rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Fires when OBS (or any publisher) connects
            exec_publish /home/vspot/on_publish.sh $name;

            # Fires when OBS disconnects
            exec_publish_done /home/vspot/on_publish_done.sh;
        }
    }
}
