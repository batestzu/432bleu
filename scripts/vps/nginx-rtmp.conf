rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;

            # Cut a stalled publisher loose instead of waiting for TCP to give
            # up. On 2026-09-03 the venue WiFi died mid-show and nginx held the
            # half-open OBS connection with retransmits still pending, so
            # exec_publish_done never fired, the house loop never came back, and
            # the Icecast bed went silent. OBS sends audio continuously, so ten
            # seconds without a packet means the link is genuinely gone.
            drop_idle_publisher 10s;

            # Fires when OBS (or any publisher) connects
            exec_publish /home/vspot/on_publish.sh $name;

            # Fires when OBS disconnects
            exec_publish_done /home/vspot/on_publish_done.sh;
        }
    }
}
