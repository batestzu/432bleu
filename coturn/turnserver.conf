# TURN relay for the proximity WebRTC mesh (RemotePeer/SimplePeer).
#
# LiveKit's embedded TURN already owns the standard ports -- 3478/udp and 5349/tcp,
# see the `turn:` block in livekit-config.yaml -- so coturn runs one port up on each.
# The two are unrelated servers: LiveKit's TURN only accepts LiveKit session tokens,
# which is why the mesh needs its own relay rather than borrowing that one.
#
# The static-auth-secret is NOT here on purpose. It is passed on the command line from
# TURN_STATIC_AUTH_SECRET in .env (see the coturn service in docker-compose.yaml) so
# the secret stays in one place and out of git. It must match the value the play
# service uses to mint time-limited credentials, or every relay allocation is rejected.

listening-ip=0.0.0.0
listening-port=3479
tls-listening-port=5350

# Hetzner gives the host its public IP directly and the container runs with
# network_mode: host, but state it explicitly: a TURN server that cannot name its own
# public address hands out relay candidates nobody outside can reach -- the exact
# failure that looks like "works on wifi, dead on cellular".
external-ip=5.78.195.138

# Relay range. Kept small deliberately: every port here must be reachable from the
# public internet, and each concurrent relay session consumes one.
min-port=49160
max-port=49200

realm=turn.432bleu.com
server-name=turn.432bleu.com

# Time-limited credentials derived from the shared secret (coturn's "REST API" mode)
# rather than a fixed username/password.
use-auth-secret

# Reuses the certificate Caddy already obtains and renews for turn.432bleu.com -- the
# same one LiveKit's TURN mounts. Serving coturn under that hostname instead of
# coturn.432bleu.com avoids a second certificate entirely.
# NOTE: coturn reads these once at startup, so it needs a restart after each renewal.
cert=/etc/caddy-certs/turn.432bleu.com.crt
pkey=/etc/caddy-certs/turn.432bleu.com.key

fingerprint
stale-nonce
no-multicast-peers
no-cli
total-quota=100
bps-capacity=0
log-file=stdout
