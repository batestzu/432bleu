<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>432 BLEU — Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: linear-gradient(180deg, #061d28 0%, #03101a 60%, #02080e 100%);
      background-attachment: fixed;
      color: #fff;
      font-family: "Space Grotesk", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(95,230,221,0.2);
      background: rgba(6,29,40,0.6);
      padding: 40px 36px 36px;
      text-align: center;
    }

    .eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.34em;
      color: #5fe6dd;
      margin-bottom: 16px;
    }

    .title {
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 32px;
      word-break: break-word;
    }

    .title .email { color: #5fe6dd; }

    .enter-btn {
      display: block;
      width: 100%;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid #5fe6dd;
      background: rgba(95,230,221,0.12);
      cursor: pointer;
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.14em;
      color: #5fe6dd;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s ease;
    }

    .enter-btn:hover { background: rgba(95,230,221,0.22); }

    .enter-btn[disabled] { opacity: 0.5; cursor: default; }

    .access-note {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      line-height: 1.6;
      color: rgba(154,242,232,0.5);
      margin-bottom: 20px;
    }

    .logout-btn {
      width: 100%;
      padding: 16px;
      border: 1px solid rgba(95,230,221,0.3);
      cursor: pointer;
      font-family: "Unbounded", sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.14em;
      background: transparent;
      color: #fff;
      transition: all 0.2s ease;
    }

    .logout-btn:hover { border-color: #5fe6dd; color: #5fe6dd; }

    .data-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(95,230,221,0.15);
      cursor: pointer;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      background: transparent;
      color: rgba(154,242,232,0.65);
      transition: all 0.2s ease;
    }

    .data-btn:hover { border-color: #5fe6dd; color: #5fe6dd; }

    .data-btn.danger:hover { border-color: #ff3b3b; color: #ff3b3b; }

    .notice {
      margin-top: 14px;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      line-height: 1.6;
      letter-spacing: 0.04em;
      color: #ff3b3b;
      display: none;
    }

    .privacy-link {
      display: inline-block;
      margin-top: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(154,242,232,0.45);
      text-decoration: none;
    }

    .privacy-link:hover { color: #5fe6dd; }
  </style>
</head>
<body>
  <div class="card" id="card" style="display:none;">
    <div class="eyebrow">MEMBER ACCOUNT</div>
    <div class="title">Logged in as<br><span class="email" id="email"></span></div>
    <button class="enter-btn" id="enter-btn" onclick="enterRoom()" style="display:none;">ENTER THE ROOM</button>
    <a class="enter-btn" id="get-ticket" href="/" style="display:none;">GET A TICKET</a>
    <div class="access-note" id="access-note"></div>
    <button class="logout-btn" onclick="logout()">LOG OUT</button>
    <button class="data-btn" onclick="exportData()">EXPORT MY DATA</button>
    <button class="data-btn danger" onclick="deleteAccount()">DELETE MY DATA</button>
    <div class="notice" id="notice"></div>
    <a class="privacy-link" href="/">BOX OFFICE</a>
    <a class="privacy-link" href="/privacy" style="margin-left:18px;">PRIVACY POLICY</a>
  </div>

  <script>
    let roomUrl = 'https://play.432bleu.com/~/concert.wam';

    async function init() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        const data = await res.json();
        roomUrl = data.room_url || roomUrl;
        document.getElementById('email').textContent = data.email;
        if (data.has_access) {
          document.getElementById('enter-btn').style.display = 'block';
          document.getElementById('access-note').textContent =
            data.access_kind === 'membership' ? 'ACTIVE MEMBERSHIP' : 'TICKET ON FILE';
        } else {
          document.getElementById('get-ticket').style.display = 'block';
          document.getElementById('access-note').textContent =
            'NO ACTIVE MEMBERSHIP OR TICKET ON THIS ACCOUNT';
        }
        document.getElementById('card').style.display = 'block';
      } catch {
        window.location.href = '/login';
      }
    }

    async function enterRoom() {
      const btn = document.getElementById('enter-btn');
      btn.disabled = true;
      btn.textContent = 'OPENING DOORS…';
      const res = await fetch('/api/auth/room-pass', { method: 'POST' });
      if (!res.ok) {
        btn.disabled = false;
        btn.textContent = 'ENTER THE ROOM';
        showNotice(res.status === 403
          ? 'No active membership or valid ticket on this account.'
          : 'Could not open the doors — try again in a minute.');
        return;
      }
      window.location.href = (await res.json()).room_url || roomUrl;
    }

    async function logout() {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    function showNotice(msg) {
      const el = document.getElementById('notice');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function exportData() {
      const res = await fetch('/api/auth/export');
      if (!res.ok) { showNotice('Export failed — try again in a minute.'); return; }
      const blob = new Blob([JSON.stringify(await res.json(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '432bleu-data-export.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function deleteAccount() {
      if (!confirm('Permanently remove your name and email from all our records? '
        + 'Ticket codes stay valid but will no longer be tied to you. This cannot be undone.')) return;
      const res = await fetch('/api/auth/delete-account', { method: 'POST' });
      if (res.status === 409) {
        showNotice((await res.json()).detail);
        return;
      }
      if (!res.ok) { showNotice('Deletion failed — try again in a minute.'); return; }
      window.location.href = '/';
    }

    init();
  </script>
</body>
</html>
