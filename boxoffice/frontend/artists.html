<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>432 BLEU · Artist Streaming Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
<meta name="color-scheme" content="dark">
<style>

:root{
  --ink900:#02060a; --ink800:#04101a; --ink700:#062330;
  --teal500:#15a3a8; --teal300:#5fe6dd; --teal200:#9af2e8;
  --cyan:#00f0ff; --magenta:#ff2bd6; --lime:#c8ff3d; --paper:#eafcff;
  --panel:rgba(6,29,40,.6); --line:rgba(95,230,221,.16); --line-hot:rgba(95,230,221,.35);
  --mute:rgba(234,252,255,.55);
  --disp:'Unbounded',sans-serif; --body:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; background:var(--ink900); color:var(--paper);
  font-family:var(--body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(52rem 34rem at 85% -8%, rgba(0,240,255,.075), transparent 62%),
    radial-gradient(44rem 30rem at -12% 32%, rgba(122,59,255,.07), transparent 60%),
    radial-gradient(40rem 30rem at 108% 88%, rgba(255,43,214,.05), transparent 60%);
}
a{color:var(--teal300); text-decoration-color:rgba(95,230,221,.4); text-underline-offset:3px}
a:hover{color:var(--teal200)}
:focus-visible{outline:2px solid var(--cyan); outline-offset:2px; border-radius:2px}

/* ── STAGE DOOR (lock) ─────────────────────────────── */
#door{
  position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
  padding:1.5rem;
  background:linear-gradient(180deg,#061d28 0%,#03101a 60%,#02080e 100%);
  transition:opacity .45s ease;
}
#door.open{opacity:0; pointer-events:none}
.rings{position:absolute; inset:0; overflow:hidden; pointer-events:none}
.ring{
  position:absolute; left:50%; top:50%; width:34rem; height:34rem;
  margin:-17rem 0 0 -17rem; border-radius:50%;
  border:1px solid rgba(95,230,221,.14);
  animation:pulse 6s ease-out infinite;
}
.ring:nth-child(2){animation-delay:2s}
.ring:nth-child(3){animation-delay:4s}
@keyframes pulse{0%{transform:scale(.3);opacity:0}18%{opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.25;transform:scale(.75)}}
.door-card{
  position:relative; width:100%; max-width:24rem; text-align:center;
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:2.6rem 2rem 2.2rem; backdrop-filter:blur(6px);
}
.door-eyebrow{font-family:var(--mono); font-size:.68rem; letter-spacing:.34em; color:var(--cyan); margin-bottom:1rem}
.door-card h1{font-family:var(--disp); font-weight:800; font-size:1.5rem; letter-spacing:-.02em; margin:0 0 .5rem; text-wrap:balance}
.door-sub{font-size:.88rem; color:var(--mute); margin:0 0 1.6rem}
#pin{
  width:100%; padding:.85rem 1rem; text-align:center;
  font-family:var(--mono); font-size:1.15rem; letter-spacing:.3em;
  color:var(--paper); background:rgba(255,255,255,.04);
  border:1px solid var(--line-hot); border-radius:4px;
}
#pin::placeholder{color:rgba(234,252,255,.25); letter-spacing:.2em}
#unlock{
  width:100%; margin-top:.8rem; padding:.85rem 1rem; cursor:pointer;
  font-family:var(--disp); font-weight:500; font-size:.8rem; letter-spacing:.14em;
  color:var(--ink900); background:var(--teal300); border:0; border-radius:4px;
  transition:background .15s ease;
}
#unlock:hover{background:var(--teal200)}
#unlock:disabled{opacity:.5; cursor:wait}
#door-msg{font-family:var(--mono); font-size:.7rem; letter-spacing:.15em; min-height:1.2rem; margin-top:1rem; color:var(--mute)}
#door-msg.err{color:var(--magenta)}

/* ── GUIDE ─────────────────────────────────────────── */
#stage{position:relative; z-index:1; display:none; max-width:46rem; margin:0 auto; padding:3.5rem 1.4rem 4rem}
#stage.lit{display:block; animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#stage.lit{animation:none}}

.masthead{margin-bottom:3.2rem}
.eyebrow{font-family:var(--mono); font-size:.7rem; letter-spacing:.34em; color:var(--cyan); margin-bottom:1.1rem}
.masthead h1{
  font-family:var(--disp); font-weight:800; font-size:clamp(2.1rem,6.5vw,3.4rem);
  line-height:1.04; letter-spacing:-.02em; margin:0 0 1.1rem; text-wrap:balance;
}
.lede{font-size:1.08rem; color:rgba(234,252,255,.82); max-width:34rem; margin:0 0 1.6rem}
.statusbar{
  display:flex; align-items:center; gap:.6rem;
  font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; color:var(--mute);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:.6rem 0;
}
.dot{width:.45rem; height:.45rem; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); flex:none}

.sec{margin:0 0 3.4rem}
.sec-eyebrow{
  display:flex; align-items:baseline; gap:.9rem;
  font-family:var(--mono); font-size:.72rem; letter-spacing:.3em; color:var(--teal300);
  border-bottom:1px solid var(--line); padding-bottom:.7rem; margin-bottom:1.4rem;
}
.sec-num{font-weight:700; color:var(--cyan)}
h3{font-family:var(--disp); font-weight:500; font-size:1.02rem; letter-spacing:.01em; margin:2.1rem 0 .8rem}
p{margin:0 0 1rem}
strong{color:#fff}

.diagram{
  font-family:var(--mono); font-size:.78rem; overflow-x:auto;
  background:var(--ink800); border:1px solid var(--line); border-radius:6px;
  padding:1.1rem 1.2rem; margin:1.4rem 0;
}
.d-row{display:flex; align-items:center; gap:.7rem; white-space:nowrap}
.d-row.d-sub{margin-top:.5rem; padding-left:1.4rem}
.d-node{border:1px solid var(--line-hot); border-radius:3px; padding:.25rem .6rem; letter-spacing:.12em}
.d-node.d-hot{color:var(--ink900); background:var(--teal300); border-color:var(--teal300); font-weight:700}
.d-arrow,.d-branch{color:var(--teal500)}
.d-note{color:var(--mute); letter-spacing:.05em}

.twocol{display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:1rem; margin:1.4rem 0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:1.2rem 1.3rem}
.card-title{font-family:var(--mono); font-size:.66rem; letter-spacing:.3em; color:var(--cyan); margin-bottom:.8rem}
.card ul{margin:0; padding-left:1.1rem; font-size:.92rem}
.card li{margin:0 0 .55rem}
.card li:last-child{margin-bottom:0}

.steps{padding-left:1.3rem; margin:0 0 1rem}
.steps li{margin-bottom:.7rem}
.keybox{
  font-family:var(--mono); font-size:.8rem; margin:.8rem 0 .3rem;
  background:var(--ink800); border:1px solid var(--line-hot); border-radius:6px;
  padding:.9rem 1.1rem; overflow-x:auto;
}
.kb-row{display:flex; gap:1.2rem; padding:.3rem 0; white-space:nowrap}
.kb-label{color:var(--mute); letter-spacing:.15em; width:7.5rem; flex:none}
.kb-val{color:var(--teal300); font-weight:700}
.kb-dim{color:var(--mute); font-weight:400; font-style:italic}

.tbl-cap{font-family:var(--mono); font-size:.72rem; letter-spacing:.12em; color:var(--teal200); margin:1.1rem 0 .45rem}
.dim{color:var(--mute)} .dim-p{color:var(--mute); font-size:.9rem}
.tbl-wrap{overflow-x:auto; margin:0 0 .6rem}
table{width:100%; border-collapse:collapse; font-size:.86rem; background:rgba(255,255,255,.02)}
td,th{border:1px solid var(--line); padding:.55rem .8rem; text-align:left; vertical-align:top}
th{font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; color:var(--cyan); font-weight:400}
table.num td{font-variant-numeric:tabular-nums}
table.num td:first-child{white-space:nowrap}
table.plat td:first-child{font-family:var(--mono); font-size:.78rem; white-space:nowrap; color:var(--teal200)}
code{font-family:var(--mono); font-size:.82em; color:var(--teal300); word-break:break-all}
.warn{color:var(--magenta)}

.aside{font-size:.88rem; color:var(--mute); border-left:2px solid var(--line-hot); padding-left:1rem; margin:1.1rem 0}

.checks{list-style:none; padding:0; margin:0 0 1rem}
.checks li{padding-left:1.7rem; position:relative; margin-bottom:.55rem; font-size:.95rem}
.checks li::before{
  content:"▸"; position:absolute; left:.2rem; top:0;
  font-family:var(--mono); color:var(--lime);
}

.callout{
  border:1px solid var(--line-hot); border-left:3px solid var(--teal300);
  border-radius:0 6px 6px 0; background:var(--panel); padding:1.1rem 1.3rem; margin:1.6rem 0; font-size:.93rem;
}
.callout.mag{border-left-color:var(--magenta); border-color:rgba(255,43,214,.3)}
.callout.mag .co-label{color:var(--magenta)}
.co-label{font-family:var(--mono); font-size:.64rem; letter-spacing:.3em; color:var(--cyan); margin-bottom:.6rem}
.callout ul{margin:0; padding-left:1.1rem}
.callout li{margin-bottom:.55rem}
.callout li:last-child{margin-bottom:0}

.opt{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:1.2rem 1.3rem; margin:1rem 0}
.opt-head{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; font-family:var(--disp); font-weight:500; font-size:.95rem; margin-bottom:.7rem}
.opt-tag{font-family:var(--mono); font-size:.64rem; letter-spacing:.25em; color:var(--ink900); background:var(--teal300); border-radius:3px; padding:.2rem .5rem; font-weight:700}
.opt-rec{font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; color:var(--lime); border:1px solid rgba(200,255,61,.35); border-radius:3px; padding:.15rem .45rem}
.opt-note{font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; color:var(--mute); border:1px solid var(--line); border-radius:3px; padding:.15rem .45rem}
.opt p{font-size:.93rem}
.pm{list-style:none; padding:0; margin:.4rem 0 .8rem; font-size:.88rem}
.pm li{padding-left:1.5rem; position:relative; margin-bottom:.35rem}
.pm li.plus::before{content:"+"; position:absolute; left:.2rem; font-family:var(--mono); color:var(--lime); font-weight:700}
.pm li.minus::before{content:"−"; position:absolute; left:.2rem; font-family:var(--mono); color:var(--magenta); font-weight:700}

details{border:1px solid var(--line); border-radius:6px; margin-bottom:.6rem; background:rgba(255,255,255,.02)}
summary{cursor:pointer; padding:.8rem 1.1rem; font-weight:600; font-size:.93rem; list-style:none; position:relative; padding-right:2.4rem}
summary::-webkit-details-marker{display:none}
summary::after{content:"+"; position:absolute; right:1.1rem; top:.7rem; font-family:var(--mono); color:var(--teal300)}
details[open] summary::after{content:"−"}
details p{padding:0 1.1rem .9rem; margin:0; font-size:.9rem; color:rgba(234,252,255,.82)}

.foot{border-top:1px solid var(--line); padding-top:1.6rem; margin-top:1rem}
.foot-mark{font-family:var(--disp); font-weight:800; font-size:1rem; letter-spacing:.08em; margin-bottom:.4rem}
.foot-line{font-family:var(--mono); font-size:.64rem; letter-spacing:.22em; color:var(--mute)}
</style>
</head>
<body>
<div id="door">
  <div class="rings" aria-hidden="true"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
  <form class="door-card" id="door-form">
    <div class="door-eyebrow">STAGE DOOR</div>
    <h1>Artists Only</h1>
    <p class="door-sub">This guide is for booked and prospective 432&nbsp;BLEU artists. Enter the access code you were given.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="ACCESS CODE" aria-label="Access code">
    <button id="unlock" type="submit">OPEN THE DOOR</button>
    <div id="door-msg" role="status"></div>
  </form>
</div>

<main id="stage"></main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pin){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(VAULT.salt), iterations:VAULT.iters, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, true, ['decrypt']);
}

async function tryOpen(key){
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(VAULT.iv)}, key, b64(VAULT.data));
  document.getElementById('stage').innerHTML = new TextDecoder().decode(plain);
  document.getElementById('door').classList.add('open');
  document.getElementById('stage').classList.add('lit');
}

const form = document.getElementById('door-form');
const msg = document.getElementById('door-msg');
const btn = document.getElementById('unlock');

form.addEventListener('submit', async e => {
  e.preventDefault();
  const pin = document.getElementById('pin').value.trim();
  if(!pin) return;
  btn.disabled = true; msg.className=''; msg.textContent = 'CHECKING…';
  try{
    const key = await deriveKey(pin);
    await tryOpen(key);
    msg.textContent = '';
    try{
      const raw = await crypto.subtle.exportKey('raw', key);
      sessionStorage.setItem('bleu_stage_key', btoa(String.fromCharCode(...new Uint8Array(raw))));
    }catch(_){}
  }catch(_){
    msg.className = 'err'; msg.textContent = 'WRONG CODE — CHECK WITH THE VENUE';
    btn.disabled = false;
    document.getElementById('pin').select();
  }
});

// Same-tab refresh: reuse cached key so the door doesn't re-ask.
(async () => {
  const cached = sessionStorage.getItem('bleu_stage_key');
  if(!cached) return;
  try{
    const key = await crypto.subtle.importKey('raw', b64(cached), {name:'AES-GCM'}, false, ['decrypt']);
    await tryOpen(key);
  }catch(_){ sessionStorage.removeItem('bleu_stage_key'); }
})();
</script>
